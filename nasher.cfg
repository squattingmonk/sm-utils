[package]
name = "sm-utils"
description = "Utility scripts for Neverwinter Nights"
version = "0.1.1"
url = "https://github.com/squattingmonk/sm-utils"
author = "Squatting Monk <squattingmonk@gmail.com>"

  [package.sources]
  include = "src/*.nss"
  skipCompile = "util_i_library.nss"

  [package.rules]
  "*" = "src"

[target]
name = "default"
file = "sm_utils.erf"
description = "An importable erf for use in new or existing modules"

[target]
name = "test"
file = "sm_utils_test.mod"
description = "A minimal module that runs the unit tests in tests/ on load"

  [target.sources]
  include = "src/*.nss"
  include = "tests/*.nss"
  include = "tests/module/*.json"
